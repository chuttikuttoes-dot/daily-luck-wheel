<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Surf Rider 🏄‍♂️🌊</title>
    <style>
        :root {
            --bg-color: #0d1b2a;
            --card-bg: #1b263b;
            --accent-cyan: #00f2fe;
            --accent-gold: #ffd700;
            --text-color: #ffffff;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas#surfCanvas {
            width: 100%;
            height: 520px;
            background: linear-gradient(180deg, #0077b6 0%, #0096c7 40%, #03045e 100%);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 242, 254, 0.2);
            touch-action: none;
        }

        /* Mobile Touch Controls */
        .controls-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 12px;
            gap: 10px;
        }

        .ctrl-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--card-bg);
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            active {
                background: var(--accent-cyan);
                color: #000;
            }
        }

        .btn-jump {
            background: linear-gradient(135deg, #ff7d00, #ff4500);
        }
    </style>
</head>
<body>

    <header>
        <h1>Retro Surf Rider 🏄‍♂️🌊</h1>
    </header>

    <div class="game-container">
        <canvas id="surfCanvas" width="400" height="520"></canvas>

        <!-- Touch Controls for Mobile / Instagram Webviews -->
        <div class="controls-panel">
            <button id="btnLeft" class="ctrl-btn">◀ Left</button>
            <button id="btnJump" class="ctrl-btn btn-jump">🦘 Jump</button>
            <button id="btnRight" class="ctrl-btn">Right ▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('surfCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Variables
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let highScore = localStorage.getItem('surf_highscore') || 0;
        let speed = 4;
        let frameCount = 0;

        // Web Audio Synthesizer
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'coin') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); // A5
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        // Surfer Player Object
        const player = {
            x: canvas.width / 2,
            y: 380,
            width: 30,
            height: 45,
            vx: 0,
            speed: 5,
            isJumping: false,
            jumpHeight: 0,
            jumpVelocity: 0,
            
            reset() {
                this.x = canvas.width / 2;
                this.vx = 0;
                this.isJumping = false;
                this.jumpHeight = 0;
            },

            jump() {
                if (!this.isJumping) {
                    this.isJumping = true;
                    this.jumpVelocity = 10;
                    playSound('jump');
                }
            },

            update() {
                this.x += this.vx;
                // Screen boundary constraints
                if (this.x < 30) this.x = 30;
                if (this.x > canvas.width - 30) this.x = canvas.width - 30;

                // Jump gravity physics
                if (this.isJumping) {
                    this.jumpHeight += this.jumpVelocity;
                    this.jumpVelocity -= 0.6; // Gravity
                    if (this.jumpHeight <= 0) {
                        this.jumpHeight = 0;
                        this.isJumping = false;
                    }
                }
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y - this.jumpHeight);

                // Shadow when jumping
                if (this.jumpHeight > 0) {
                    ctx.beginPath();
                    ctx.ellipse(0, this.jumpHeight + 15, 18, 6, 0, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.fill();
                }

                // Surfboard
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.ellipse(0, 10, 10, 24, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ff7d00';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Surfer Figure
                ctx.fillStyle = '#00f2fe';
                ctx.beginPath();
                ctx.arc(0, -8, 7, 0, Math.PI * 2); // Head
                ctx.fill();

                ctx.fillStyle = '#ff4b82'; // Torso
                ctx.fillRect(-6, -1, 12, 14);

                ctx.restore();
            }
        };

        // Entities Array (Obstacles & Coins)
        let entities = [];

        function spawnEntity() {
            const types = [
                { type: 'rock', emoji: '🪨', size: 24, isObstacle: true },
                { type: 'shark', emoji: '🦈', size: 28, isObstacle: true },
                { type: 'buoy', emoji: '🟡', size: 20, isObstacle: true },
                { type: 'star', emoji: '⭐', size: 22, isObstacle: false }
            ];
            
            const selected = types[Math.floor(Math.random() * types.length)];
            entities.push({
                ...selected,
                x: Math.random() * (canvas.width - 60) + 30,
                y: -40
            });
        }

        // Ocean Wave Lines Animation
        let waveOffset = 0;
        function drawWaves() {
            waveOffset += speed * 0.5;
            if (waveOffset > 40) waveOffset = 0;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;

            for (let y = waveOffset - 40; y < canvas.height; y += 40) {
                ctx.beginPath();
                for (let x = 0; x < canvas.width; x += 20) {
                    ctx.lineTo(x, y + Math.sin((x + waveOffset) * 0.05) * 5);
                }
                ctx.stroke();
            }
        }

        // Main Loop Update
        function update() {
            if (gameState !== 'PLAYING') return;

            frameCount++;
            score += 0.1;
            speed = 4 + Math.floor(score / 50) * 0.5; // Gradually speed up

            player.update();

            // Spawn Entities
            if (frameCount % Math.max(30, 80 - Math.floor(speed * 3)) === 0) {
                spawnEntity();
            }

            // Update Entities
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                e.y += speed;

                // Collision Detection
                let dx = player.x - e.x;
                let dy = player.y - player.jumpHeight - e.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.width / 2 + e.size / 2) {
                    if (e.isObstacle) {
                        // Jump over check
                        if (!player.isJumping || player.jumpHeight < 15) {
                            gameOver();
                            return;
                        }
                    } else {
                        // Collect Starfish
                        score += 25;
                        playSound('coin');
                        entities.splice(i, 1);
                        continue;
                    }
                }

                // Remove off-screen items
                if (e.y > canvas.height + 40) {
                    entities.splice(i, 1);
                }
            }
        }

        // Render Frame
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawWaves();

            if (gameState === 'PLAYING') {
                player.draw();

                // Draw Entities
                entities.forEach(e => {
                    ctx.font = `${e.size}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(e.emoji, e.x, e.y);
                });

                // HUD Score
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`Score: ${Math.floor(score)}`, 15, 30);
            } else if (gameState === 'START') {
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('Retro Surf Rider 🏄‍♂️', canvas.width / 2, 200);

                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#00f2fe';
                ctx.fillText('Dodge Rocks & Sharks | Catch Starfish', canvas.width / 2, 240);
                ctx.fillText('Press SPACE or Tap Jump to Start', canvas.width / 2, 280);
            } else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = '#ff4b82';
                ctx.textAlign = 'center';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText('WIPE OUT! 💥', canvas.width / 2, 180);

                ctx.fillStyle = '#ffffff';
                ctx.font = '18px sans-serif';
                ctx.fillText(`Final Score: ${Math.floor(score)}`, canvas.width / 2, 230);
                ctx.fillText(`High Score: ${Math.floor(highScore)}`, canvas.width / 2, 260);

                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#00f2fe';
                ctx.fillText('Press SPACE or Tap to Play Again', canvas.width / 2, 310);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);

        function startGame() {
            initAudio();
            score = 0;
            speed = 4;
            frameCount = 0;
            entities = [];
            player.reset();
            gameState = 'PLAYING';
        }

        function gameOver() {
            playSound('crash');
            gameState = 'GAMEOVER';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('surf_highscore', highScore);
            }
        }

        // Event Listeners (Keyboard)
        window.addEventListener('keydown', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -player.speed;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = player.speed;
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (gameState === 'PLAYING') player.jump();
                else startGame();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'ArrowRight' || e.code === 'KeyD') {
                player.vx = 0;
            }
        });

        // Touch Control Listeners
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnJump = document.getElementById('btnJump');

        btnLeft.addEventListener('pointerdown', () => { player.vx = -player.speed; });
        btnLeft.addEventListener('pointerup', () => { player.vx = 0; });
        btnRight.addEventListener('pointerdown', () => { player.vx = player.speed; });
        btnRight.addEventListener('pointerup', () => { player.vx = 0; });
        
        btnJump.addEventListener('pointerdown', () => {
            if (gameState === 'PLAYING') player.jump();
            else startGame();
        });

        canvas.addEventListener('pointerdown', () => {
            if (gameState !== 'PLAYING') startGame();
        });
    </script>
</body>
</html>
