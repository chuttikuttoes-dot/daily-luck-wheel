<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Firework Celebration 🪔🌀🚀🧨</title>
    <!-- Official YouTube Playables SDK -->
    <script src="[suspicious link removed]"></script>
    <style>
        :root {
            --bg-color: #050714;
            --accent-gold: #ffd700;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff4b82;
            --accent-red: #ff3344;
            --text-color: #ffffff;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px 10px;
            background-image: radial-gradient(circle at 50% 20%, #151936 0%, #050714 80%);
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--accent-gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 0.88rem;
            color: #a0aec0;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas#fireworkCanvas {
            width: 100%;
            height: 540px;
            background: linear-gradient(180deg, #050818 0%, #080c28 50%, #1a0f07 100%);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.2);
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ultimate Fireworks Festival 🪔🌀🚀🧨</h1>
        <p class="subtitle">Touch fuses to light Pots, Chakris, Rockets, Ladi Strings & Sound Bombs!</p>
    </header>

    <div class="game-wrapper">
        <canvas id="fireworkCanvas" width="460" height="540"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('fireworkCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let ignitedCount = 0;
        let pointer = { x: -100, y: -100, isDown: false };
        let isPausedByYouTube = false;

        // --- YOUTUBE PLAYABLES SDK INTEGRATION ---
        window.addEventListener('load', () => {
            if (window.ytgame && window.ytgame.game) {
                // Signal to YouTube Playables that the first frame is ready
                window.ytgame.game.firstFrameReady();

                // Handle YouTube pause / resume events
                window.ytgame.game.onPause(() => {
                    isPausedByYouTube = true;
                    if (audioCtx && audioCtx.state === 'running') {
                        audioCtx.suspend();
                    }
                });

                window.ytgame.game.onResume(() => {
                    isPausedByYouTube = false;
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                });
            }
        });
        // ----------------------------------------

        // Web Audio Synthesizer
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx || isPausedByYouTube) return;
            try {
                if (type === 'fuse') {
                    const bufferSize = audioCtx.sampleRate * 0.08;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.value = 1200;

                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start();
                } else if (type === 'fountain') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'chakri_whir') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800 + Math.random() * 400, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'rocket_launch') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.6);
                } else if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'bomb_boom') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch (e) {}
        }

        // Spark Particle Class
        class SparkParticle {
            constructor(x, y, vx, vy, color, options = {}) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.gravity = options.gravity !== undefined ? options.gravity : 0.2;
                this.friction = options.friction !== undefined ? options.friction : 0.98;
                this.alpha = 1;
                this.decay = options.decay || (0.015 + Math.random() * 0.02);
                this.size = options.size || (Math.random() * 3 + 2);
            }

            update() {
                this.vx *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 1. FLOWER POT (Anaar)
        class FlowerPot {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.width = 34;
                this.height = 42;
                this.type = type;
                this.state = 'IDLE';
                this.fuseProgress = 0;
                this.burstTimer = 0;
                this.maxBurstTime = type === 'rainbow' ? 240 : 160;
                this.colors = type === 'rainbow' ? ['#ff0055', '#ffd700', '#00f2fe', '#00e676', '#e040fb'] : ['#ffd700', '#ffae00', '#ffffff', '#ff8c00'];
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.width / 1.6, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.state === 'BURNT') {
                    ctx.fillStyle = '#222225';
                } else {
                    let grad = ctx.createLinearGradient(-this.width / 2, 0, this.width / 2, 0);
                    grad.addColorStop(0, '#8d2d14');
                    grad.addColorStop(0.5, '#d84315');
                    grad.addColorStop(1, '#641e0b');
                    ctx.fillStyle = grad;
                }

                ctx.beginPath();
                ctx.moveTo(-this.width / 2, 0);
                ctx.lineTo(-this.width / 4, -this.height);
                ctx.lineTo(this.width / 4, -this.height);
                ctx.lineTo(this.width / 2, 0);
                ctx.closePath();
                ctx.fill();

                if (this.state !== 'BURNT') {
                    ctx.fillStyle = this.colors;
                    ctx.fillRect(-this.width / 3, -this.height * 0.6, this.width * 0.66, 6);
                }

                if (this.state === 'IDLE' || this.state === 'FUSE_BURNING') {
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(0, -this.height);
                    ctx.quadraticCurveTo(8, -this.height - 10, 10 - this.fuseProgress * 0.1, -this.height - 15 + this.fuseProgress * 0.15);
                    ctx.stroke();

                    if (this.state === 'FUSE_BURNING') {
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(10 - this.fuseProgress * 0.1, -this.height - 15 + this.fuseProgress * 0.15, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.restore();
            }

            ignite() {
                if (this.state === 'IDLE') { this.state = 'FUSE_BURNING'; playSound('fuse'); }
            }

            update() {
                if (this.state === 'FUSE_BURNING') {
                    this.fuseProgress += 3.5;
                    playSound('fuse');
                    if (this.fuseProgress >= 100) { this.state = 'BURSTING'; ignitedCount++; score += 50; }
                } else if (this.state === 'BURSTING') {
                    this.burstTimer++;
                    for (let i = 0; i < 8; i++) {
                        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.75;
                        const speed = 7 + Math.random() * 8;
                        particles.push(new SparkParticle(
                            this.x + (Math.random() - 0.5) * 6,
                            this.y - this.height,
                            Math.cos(angle) * speed, Math.sin(angle) * speed,
                            this.colors[Math.floor(Math.random() * this.colors.length)]
                        ));
                    }
                    if (this.burstTimer % 4 === 0) playSound('fountain');
                    if (this.burstTimer >= this.maxBurstTime) this.state = 'BURNT';
                }
            }
        }

        // 2. CHAKRI (Ground Spinner)
        class GroundChakri {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.radius = 18;
                this.type = type;
                this.state = 'IDLE';
                this.fuseProgress = 0;
                this.angle = 0;
                this.spinSpeed = 0;
                this.spinTimer = 0;
                this.maxSpinTime = 160;
                this.colors = type === 'rainbow' ? ['#ff0055', '#ffd700', '#00f2fe', '#00e676', '#e040fb'] : ['#00e676', '#00f2fe', '#ffffff'];
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.state === 'BURNT' ? '#252528' : this.colors;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                if (this.state === 'IDLE' || this.state === 'FUSE_BURNING') {
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - this.radius);
                    ctx.lineTo(this.x + 8 - this.fuseProgress * 0.08, this.y - this.radius - 10);
                    ctx.stroke();

                    if (this.state === 'FUSE_BURNING') {
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(this.x + 8 - this.fuseProgress * 0.08, this.y - this.radius - 10, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            ignite() {
                if (this.state === 'IDLE') { this.state = 'FUSE_BURNING'; playSound('fuse'); }
            }

            update() {
                if (this.state === 'FUSE_BURNING') {
                    this.fuseProgress += 3.5;
                    playSound('fuse');
                    if (this.fuseProgress >= 100) { this.state = 'SPINNING'; ignitedCount++; score += 75; }
                } else if (this.state === 'SPINNING') {
                    this.spinTimer++;
                    this.spinSpeed = Math.min(this.spinSpeed + 0.05, 0.45);
                    this.angle += this.spinSpeed;

                    for (let s = 0; s < 5; s++) {
                        const emitAngle = this.angle + (s * Math.PI * 2 / 5);
                        const speed = 6 + Math.random() * 6;
                        particles.push(new SparkParticle(
                            this.x + Math.cos(emitAngle) * (this.radius - 2),
                            this.y + Math.sin(emitAngle) * (this.radius - 2),
                            -Math.sin(emitAngle) * speed, Math.cos(emitAngle) * speed * 0.4,
                            this.colors[Math.floor(Math.random() * this.colors.length)],
                            { gravity: 0.05, friction: 0.94 }
                        ));
                    }
                    if (this.spinTimer % 3 === 0) playSound('chakri_whir');
                    if (this.spinTimer >= this.maxSpinTime) this.state = 'BURNT';
                }
            }
        }

        // 3. SKY ROCKET 🚀
        class SkyRocket {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.rocketY = y - 40;
                this.type = type;
                this.state = 'IDLE';
                this.fuseProgress = 0;
                this.vy = 0;
                this.targetApex = 90 + Math.random() * 60;
                this.colors = type === 'rainbow' ? ['#ff0055', '#ffd700', '#00f2fe', '#00e676', '#e040fb'] : ['#00f2fe', '#4facfe', '#ffffff'];
            }

            draw() {
                if (this.state === 'IDLE' || this.state === 'FUSE_BURNING') {
                    ctx.strokeStyle = '#8d6e63';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x, this.y - 45);
                    ctx.stroke();
                }

                if (this.state !== 'BURNT') {
                    ctx.save();
                    ctx.translate(this.x, this.rocketY);
                    ctx.fillStyle = this.colors;
                    ctx.beginPath();
                    ctx.moveTo(0, -16);
                    ctx.lineTo(-6, -4);
                    ctx.lineTo(6, -4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-5, -4, 10, 20);
                    ctx.restore();
                }

                if (this.state === 'IDLE' || this.state === 'FUSE_BURNING') {
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - 20);
                    ctx.lineTo(this.x + 6 - this.fuseProgress * 0.06, this.y - 10 + this.fuseProgress * 0.1);
                    ctx.stroke();

                    if (this.state === 'FUSE_BURNING') {
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(this.x + 6 - this.fuseProgress * 0.06, this.y - 10 + this.fuseProgress * 0.1, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            ignite() {
                if (this.state === 'IDLE') { this.state = 'FUSE_BURNING'; playSound('fuse'); }
            }

            update() {
                if (this.state === 'FUSE_BURNING') {
                    this.fuseProgress += 3.5;
                    playSound('fuse');
                    if (this.fuseProgress >= 100) {
                        this.state = 'FLYING';
                        this.vy = -7;
                        playSound('rocket_launch');
                        ignitedCount++;
                        score += 100;
                    }
                } else if (this.state === 'FLYING') {
                    this.rocketY += this.vy;
                    this.vy -= 0.15;
                    for (let i = 0; i < 3; i++) {
                        particles.push(new SparkParticle(
                            this.x + (Math.random() - 0.5) * 4, this.rocketY + 16,
                            (Math.random() - 0.5) * 1.5, 2 + Math.random() * 3,
                            '#ffd700', { gravity: 0.1, decay: 0.04, size: 2.5 }
                        ));
                    }
                    if (this.rocketY <= this.targetApex) {
                        this.state = 'BURNT';
                        playSound('bomb_boom');
                        for (let i = 0; i < 60; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 2 + Math.random() * 8;
                            particles.push(new SparkParticle(
                                this.x, this.rocketY,
                                Math.cos(angle) * speed, Math.sin(angle) * speed,
                                this.colors[Math.floor(Math.random() * this.colors.length)],
                                { gravity: 0.08, friction: 0.96, decay: 0.012, size: 3 }
                            ));
                        }
                    }
                }
            }
        }

        // 4. GARLAND STRING CRACKER (1000 Ladi) 🧨
        class LadiString {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.state = 'IDLE';
                this.fuseProgress = 0;
                this.popIndex = 0;
                this.totalCrackers = 12;
            }

            draw() {
                ctx.strokeStyle = '#ff3344';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - 140);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();

                for (let i = 0; i < this.totalCrackers; i++) {
                    const cY = this.y - 130 + (i * 10);
                    if (this.state === 'POPPING' && i < this.popIndex) continue;

                    ctx.fillStyle = '#ff1744';
                    ctx.fillRect(this.x - (i % 2 === 0 ? 8 : -2), cY, 7, 8);
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(this.x - (i % 2 === 0 ? 8 : -2), cY + 2, 7, 2);
                }

                if (this.state === 'IDLE' || this.state === 'FUSE_BURNING') {
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + 8 - this.fuseProgress * 0.08, this.y + 12);
                    ctx.stroke();

                    if (this.state === 'FUSE_BURNING') {
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(this.x + 8 - this.fuseProgress * 0.08, this.y + 12, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            ignite() {
                if (this.state === 'IDLE') { this.state = 'FUSE_BURNING'; playSound('fuse'); }
            }

            update() {
                if (this.state === 'FUSE_BURNING') {
                    this.fuseProgress += 4;
                    playSound('fuse');
                    if (this.fuseProgress >= 100) { this.state = 'POPPING'; ignitedCount++; score += 120; }
                } else if (this.state === 'POPPING') {
                    if (frameCount % 4 === 0 && this.popIndex < this.totalCrackers) {
                        const popY = this.y - 130 + (this.popIndex * 10);
                        playSound('pop');

                        for (let k = 0; k < 8; k++) {
                            particles.push(new SparkParticle(
                                this.x, popY,
                                (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6,
                                Math.random() > 0.5 ? '#ff1744' : '#ffd700',
                                { gravity: 0.15, size: 2.5 }
                            ));
                        }
                        this.popIndex++;
                        if (this.popIndex >= this.totalCrackers) this.state = 'BURNT';
                    }
                }
            }
        }

        // 5. ATOM SOUND BOMB 🥥
        class SoundBomb {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.state = 'IDLE';
                this.fuseProgress = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.state !== 'BURNT') {
                    ctx.fillStyle = '#2e7d32';
                    ctx.beginPath();
                    ctx.arc(0, 0, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.strokeStyle = '#8d6e63';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 10, 0, Math.PI * 1.5);
                    ctx.stroke();
                }

                ctx.restore();

                if (this.state === 'IDLE' || this.state === 'FUSE_BURNING') {
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - 14);
                    ctx.lineTo(this.x + 6 - this.fuseProgress * 0.06, this.y - 24);
                    ctx.stroke();

                    if (this.state === 'FUSE_BURNING') {
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(this.x + 6 - this.fuseProgress * 0.06, this.y - 24, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            ignite() {
                if (this.state === 'IDLE') { this.state = 'FUSE_BURNING'; playSound('fuse'); }
            }

            update() {
                if (this.state === 'FUSE_BURNING') {
                    this.fuseProgress += 3.5;
                    playSound('fuse');
                    if (this.fuseProgress >= 100) {
                        this.state = 'BURNT';
                        playSound('bomb_boom');
                        ignitedCount++;
                        score += 90;

                        for (let k = 0; k < 40; k++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 3 + Math.random() * 8;
                            particles.push(new SparkParticle(
                                this.x, this.y,
                                Math.cos(angle) * speed, Math.sin(angle) * speed,
                                Math.random() > 0.3 ? '#ffffff' : '#ffd700',
                                { gravity: 0.1, decay: 0.025, size: 3.5 }
                            ));
                        }
                    }
                }
            }
        }

        // Setup Scene Items
        let items = [];
        let particles = [];
        let frameCount = 0;

        function resetScene() {
            items = [
                new SkyRocket(35, 450, 'rainbow'),
                new LadiString(90, 430),
                new FlowerPot(145, 450, 'gold'),
                new GroundChakri(205, 450, 'emerald'),
                new SoundBomb(265, 445),
                new FlowerPot(325, 450, 'rainbow'),
                new GroundChakri(385, 450, 'rainbow'),
                new SkyRocket(430, 450, 'cyan')
            ];
        }
        resetScene();

        // Main Game Loop
        function loop() {
            if (!isPausedByYouTube) {
                frameCount++;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Ground floor
                ctx.fillStyle = '#110c08';
                ctx.fillRect(0, 445, canvas.width, 95);
                ctx.strokeStyle = '#2b1b10';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 445, canvas.width, 95);

                // Update & Render Fireworks
                items.forEach(item => {
                    item.update();
                    item.draw();

                    if (pointer.isDown || pointer.x > 0) {
                        let fuseY = item.y - 10;
                        if (item instanceof FlowerPot) fuseY = item.y - item.height - 10;
                        if (item instanceof GroundChakri) fuseY = item.y - item.radius - 10;
                        if (item instanceof SkyRocket) fuseY = item.y - 20;
                        if (item instanceof LadiString) fuseY = item.y;
                        if (item instanceof SoundBomb) fuseY = item.y - 24;

                        const distToFuse = Math.hypot(pointer.x - item.x, pointer.y - fuseY);
                        if (distToFuse < 28) {
                            item.ignite();
                        }
                    }
                });

                // Update & Render Sparks
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.update();
                    p.draw();
                    if (p.alpha <= 0 || p.y > 530) {
                        particles.splice(i, 1);
                    }
                }

                // Interactive Sparkler Cursor Effect (Phuljhadi)
                if (pointer.x > 0 && pointer.y > 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(pointer.x, pointer.y, 4, 0, Math.PI * 2);
                    ctx.fill();

                    for (let k = 0; k < 2; k++) {
                        particles.push(new SparkParticle(
                            pointer.x, pointer.y,
                            (Math.random() - 0.5) * 3,
                            (Math.random() - 0.5) * 3,
                            '#ffd700'
                        ));
                    }
                }

                // HUD
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`Spark Score: ${score}`, 15, 30);
                ctx.textAlign = 'right';
                ctx.fillText(`Ignited: ${ignitedCount} / ${items.length}`, canvas.width - 15, 30);

                // Reset Overlay when all items burnt
                if (items.every(item => item.state === 'BURNT')) {
                    ctx.fillStyle = 'rgba(0,0,0,0.65)';
                    ctx.fillRect(0, 190, canvas.width, 140);

                    ctx.fillStyle = '#ffd700';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('✨ ULTIMATE FESTIVAL DISPLAY! ✨', canvas.width / 2, 235);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '14px sans-serif';
                    ctx.fillText('Tap anywhere to reload fresh Firecrackers!', canvas.width / 2, 280);
                }
            }

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);

        // Input Handlers
        function handlePointer(e) {
            initAudio();
            const rect = canvas.getBoundingClientRect();
            pointer.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            pointer.y = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (items.every(item => item.state === 'BURNT')) {
                resetScene();
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            pointer.isDown = true;
            handlePointer(e);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (pointer.isDown) handlePointer(e);
        });

        window.addEventListener('pointerup', () => {
            pointer.isDown = false;
        });
    </script>
</body>
</html>
