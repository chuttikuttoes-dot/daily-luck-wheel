<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Pot Firecracker Simulator 🪔🎆</title>
    <style>
        :root {
            --bg-color: #050714;
            --accent-gold: #ffd700;
            --accent-cyan: #00f2fe;
            --accent-red: #ff3366;
            --text-color: #ffffff;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px 10px;
            background-image: radial-gradient(circle at 50% 20%, #151936 0%, #050714 80%);
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.7rem;
            color: var(--accent-gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #a0aec0;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas#fireworkCanvas {
            width: 100%;
            height: 520px;
            background: linear-gradient(180deg, #0a0e27 0%, #02030a 80%, #1a0f07 100%);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.2);
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <header>
        <h1>Flower Pot Firecracker 🪔🎆</h1>
        <p class="subtitle">Touch fuses with your sparkler to launch roaring fountains!</p>
    </header>

    <div class="game-wrapper">
        <canvas id="fireworkCanvas" width="420" height="520"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('fireworkCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let ignitedCount = 0;
        let pointer = { x: -100, y: -100, isDown: false };

        // Web Audio API Sound Synthesizer
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                if (type === 'fuse') {
                    // White noise sizzling sound
                    const bufferSize = audioCtx.sampleRate * 0.1;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.value = 1000;

                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start();
                } else if (type === 'burst') {
                    // Roaring fountain rumble sound
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.3);

                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        // Flower Pot Firecracker Class
        class FlowerPot {
            constructor(x, y, type) {
                this.x = x;
                this.y = y; // Base Y position on ground
                this.width = 45;
                this.height = 55;
                this.type = type; // 'gold', 'red', 'cyan', 'rainbow'
                this.state = 'IDLE'; // IDLE, FUSE_BURNING, BURSTING, BURNT
                this.fuseProgress = 0;
                this.burstTimer = 0;
                this.maxBurstTime = type === 'rainbow' ? 300 : 200;

                // Color configuration
                if (type === 'gold') this.colors = ['#ffd700', '#ffae00', '#ffffff', '#ff8c00'];
                else if (type === 'red') this.colors = ['#ff3366', '#ff0033', '#ffd700', '#ffffff'];
                else if (type === 'cyan') this.colors = ['#00f2fe', '#4facfe', '#ffffff', '#00e676'];
                else if (type === 'rainbow') this.colors = ['#ff0055', '#ffcc00', '#00ffcc', '#0099ff', '#e040fb'];
            }

            draw() {
                // 1. Draw Cone Body
                ctx.save();
                ctx.translate(this.x, this.y);

                // Cone shadow
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.width / 1.6, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Burnt pot appearance
                if (this.state === 'BURNT') {
                    ctx.fillStyle = '#222225';
                } else {
                    // Terracotta clay gradient with color band
                    let grad = ctx.createLinearGradient(-this.width / 2, 0, this.width / 2, 0);
                    grad.addColorStop(0, '#8d2d14');
                    grad.addColorStop(0.5, '#d84315');
                    grad.addColorStop(1, '#641e0b');
                    ctx.fillStyle = grad;
                }

                // Draw Cone Shape
                ctx.beginPath();
                ctx.moveTo(-this.width / 2, 0);
                ctx.lineTo(-this.width / 4, -this.height);
                ctx.lineTo(this.width / 4, -this.height);
                ctx.lineTo(this.width / 2, 0);
                ctx.closePath();
                ctx.fill();

                // Decorative Stripe on Pot
                if (this.state !== 'BURNT') {
                    ctx.fillStyle = this.colors[0];
                    ctx.fillRect(-this.width / 3, -this.height * 0.6, this.width * 0.66, 8);
                }

                // 2. Fuse (when not burnt)
                if (this.state === 'IDLE' || this.state === 'FUSE_BURNING') {
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, -this.height);
                    ctx.quadraticCurveTo(8, -this.height - 12, 12 - this.fuseProgress * 0.1, -this.height - 18 + this.fuseProgress * 0.2);
                    ctx.stroke();

                    // Fuse spark if burning
                    if (this.state === 'FUSE_BURNING') {
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(10 - this.fuseProgress * 0.1, -this.height - 16 + this.fuseProgress * 0.2, 4 + Math.random() * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            ignite() {
                if (this.state === 'IDLE') {
                    this.state = 'FUSE_BURNING';
                    playSound('fuse');
                }
            }

            update() {
                if (this.state === 'FUSE_BURNING') {
                    this.fuseProgress += 2.5;
                    playSound('fuse');

                    if (this.fuseProgress >= 100) {
                        this.state = 'BURSTING';
                        ignitedCount++;
                        score += 50;
                    }
                } else if (this.state === 'BURSTING') {
                    this.burstTimer++;

                    // Emit fountain particles
                    const particleCount = this.type === 'rainbow' ? 12 : 8;
                    for (let i = 0; i < particleCount; i++) {
                        const angle = -Math.PI / 2 + (Math.random() - 0.5) * (this.type === 'rainbow' ? 0.9 : 0.65);
                        const speed = 7 + Math.random() * (this.type === 'rainbow' ? 12 : 8);
                        
                        particles.push(new SparkParticle(
                            this.x + (Math.random() - 0.5) * 6,
                            this.y - this.height,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed,
                            this.colors[Math.floor(Math.random() * this.colors.length)]
                        ));
                    }

                    if (this.burstTimer % 4 === 0) playSound('burst');

                    if (this.burstTimer >= this.maxBurstTime) {
                        this.state = 'BURNT';
                    }
                }
            }
        }

        // Particle Class for Firecracker Sparks
        class SparkParticle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.gravity = 0.22;
                this.friction = 0.98;
                this.alpha = 1;
                this.decay = 0.015 + Math.random() * 0.02;
                this.size = Math.random() * 3 + 2;
            }

            update() {
                this.vx *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize Ground Pots
        let pots = [];
        let particles = [];

        function resetPots() {
            pots = [
                new FlowerPot(70, 440, 'gold'),
                new FlowerPot(150, 440, 'red'),
                new FlowerPot(230, 440, 'cyan'),
                new FlowerPot(310, 440, 'gold'),
                new FlowerPot(370, 440, 'rainbow')
            ];
        }
        resetPots();

        // Main Loop
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground reflection & texture
            ctx.fillStyle = '#110c08';
            ctx.fillRect(0, 435, canvas.width, 85);
            ctx.strokeStyle = '#2b1b10';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 435, canvas.width, 85);

            // Check touch ignition against pot fuses
            pots.forEach(pot => {
                pot.update();
                pot.draw();

                if (pointer.isDown || pointer.x > 0) {
                    const distToFuse = Math.hypot(pointer.x - pot.x, pointer.y - (pot.y - pot.height - 10));
                    if (distToFuse < 35) {
                        pot.ignite();
                    }
                }
            });

            // Update & Draw Sparks
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0 || p.y > 510) {
                    particles.splice(i, 1);
                }
            }

            // Draw Sparkler Cursor
            if (pointer.x > 0 && pointer.y > 0) {
                // Sparkler tip glowing effect
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(pointer.x, pointer.y, 4, 0, Math.PI * 2);
                ctx.fill();

                // Sparkler emissions
                for (let k = 0; k < 2; k++) {
                    particles.push(new SparkParticle(
                        pointer.x, pointer.y,
                        (Math.random() - 0.5) * 3,
                        (Math.random() - 0.5) * 3,
                        '#ffd700'
                    ));
                }
            }

            // Draw Score & HUD
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`Spark Score: ${score}`, 15, 30);
            ctx.textAlign = 'right';
            ctx.fillText(`Ignited: ${ignitedCount}`, canvas.width - 15, 30);

            // Reset Button if all pots burnt out
            if (pots.every(p => p.state === 'BURNT')) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 180, canvas.width, 140);

                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('✨ SPECTACULAR DISPLAY! ✨', canvas.width / 2, 225);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px sans-serif';
                ctx.fillText('Tap anywhere to set up fresh Flower Pots!', canvas.width / 2, 270);
            }

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);

        // Input Handlers
        function handlePointer(e) {
            initAudio();
            const rect = canvas.getBoundingClientRect();
            pointer.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            pointer.y = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (pots.every(p => p.state === 'BURNT')) {
                resetPots();
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            pointer.isDown = true;
            handlePointer(e);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (pointer.isDown) handlePointer(e);
        });

        window.addEventListener('pointerup', () => {
            pointer.isDown = false;
        });
    </script>
</body>
</html>
